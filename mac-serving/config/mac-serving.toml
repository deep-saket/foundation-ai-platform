[server]
host = "127.0.0.1"
port = 8080
backend_host = "127.0.0.1"
backend_port = 8081
startup_timeout_seconds = 300
api_key_env = "MAC_SERVING_API_KEY"

[model]
path = "../models/gemma-4-E4B-Q8_0.gguf"
alias = "gemma-4-E4B"
chat = false

[engine]
binary = "auto"
manage_process = true
gpu_layers = "all"
threads = 12
context_size = 65536
parallel = 4
batch_size = 1024
micro_batch_size = 512
cache_type_k = "q8_0"
cache_type_v = "q8_0"
flash_attention = true
continuous_batching = true
cache_prompt = true
lazy_mode = "auto"
jinja = true
mlock = false

[footprint]
model_billions = 8.0
quant_bits = 8.1
layers = 42
attention_heads = 8
kv_heads = 2
hidden_size = 2560
head_dim = 512
cache_bytes = 1.0625
